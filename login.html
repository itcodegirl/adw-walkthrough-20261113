<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Jenna Studio</title>
  </head>
  <body data-page="login">
    <header><!-- filled by src/shell.js --></header>
    <main>
      <h1>Sign in</h1>
      <p>Enter your email and we will send you a sign-in link. No password needed.</p>
      <section class="login">
        <h2>Email sign-in link</h2>
        <p class="section-status" id="login-session" role="status"></p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="email" aria-describedby="login-email-message" />
            <p class="field-message" id="login-email-message"></p>
          </div>
          <button type="submit" id="login-submit">Send sign-in link</button>
          <p class="form-status" id="login-status" role="status"></p>
        </form>
      </section>
    </main>
    <footer><!-- filled by src/shell.js --></footer>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
